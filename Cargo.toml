[package]
name = "ujira"
description = "A tiny, token-frugal MCP server and CLI for JIRA Cloud: sixteen tools, compact plain-text output."
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wseaton/ujira"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MCP wire: the official Rust SDK over stdio (what Claude Code spawns).
rmcp = { version = "3.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time"] }
# JIRA Cloud REST. rustls so there's no OpenSSL build dependency on a fresh machine.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "multipart"] }
toml = "1.1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# A stdio server that lives in the background: small binary, fast startup.
opt-level = "s"
lto = true
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "apple-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[package]
name = "ujira"
description = "A tiny, token-frugal MCP server and CLI for JIRA Cloud: sixteen tools, compact plain-text output."
version = "0.10.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wseaton/ujira"

[features]
default = ["cli"]
# The `ujira` binary: the CLI, MCP serving, and keychain token management.
cli = ["mcp", "http", "keychain", "dep:clap", "dep:tokio", "dep:tracing-subscriber"]
# The MCP tool surface (`ujira::server`, `ujira::JiraMcp`).
mcp = ["dep:rmcp", "dep:base64"]
# Serving the MCP tool surface over streamable HTTP behind bearer tokens (`ujira::http`).
http = ["mcp", "rmcp/transport-streamable-http-server", "dep:axum", "dep:tokio", "tokio/net", "tokio/fs"]
# Reading the API token from the OS credential store (`ujira::keychain`).
keychain = ["dep:keyring"]

[[bin]]
name = "ujira"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MCP wire: the official Rust SDK, over stdio (what Claude Code spawns) or streamable HTTP.
rmcp = { version = "3.1", features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time"], optional = true }
# JIRA Cloud REST. rustls so there's no OpenSSL build dependency on a fresh machine.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "multipart"] }
toml = "1.1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "serve"
required-features = ["cli"]

[profile.release]
# A stdio server that lives in the background: small binary, fast startup.
opt-level = "s"
lto = true
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "apple-native-keyring-store"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "windows-native-keyring-store"], optional = true }
